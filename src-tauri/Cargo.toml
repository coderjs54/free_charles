[package]
name = "free-charles"
version = "1.0.3"
description = "FreeCharles - HTTP 抓包代理桌面应用（Tauri 版）"
authors = ["FreeCharles"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "free_charles_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "client", "client-legacy"] }
http-body-util = "0.1"
http = "1"
tower-service = "0.3"
percent-encoding = "2"
bytes = "1"
pin-project-lite = "0.2"
futures-util = "0.3"

flate2 = "1"
brotli = "7"
zstd = "0.13"
encoding_rs = "0.8"

# HTTPS 解密：本地 CA + 上游 TLS
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "native-tokio", "tls12", "ring"] }
rustls-native-certs = "0.8"
time = "0.3"

url = "2"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
