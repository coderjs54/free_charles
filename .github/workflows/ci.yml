name: CI

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  windows:
    name: Windows build and package
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # 只缓存 src-tauri/target，避免把仓库根目录当工作区
          workspaces: src-tauri -> target
          key: ${{ runner.os }}-windows

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag.StartsWith('v')) { $tag = $tag.Substring(1) }
          $pkg = (Get-Content package.json -Raw -Encoding UTF8 | ConvertFrom-Json).version
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw -Encoding UTF8 | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          Write-Host "tag=$tag package.json=$pkg tauri.conf.json=$conf Cargo.toml=$cargo"
          if ($pkg -ne $tag -or $conf -ne $tag -or $cargo -ne $tag) {
            throw "版本号不一致：tag=$tag, package.json=$pkg, tauri.conf.json=$conf, Cargo.toml=$cargo"
          }

      - name: Install dependencies
        run: npm ci

      # 前端构建会产出 dist，Tauri 编译期通过 frontendDist 引用它，因此必须先执行
      - name: Typecheck and build frontend
        run: npm run build

      - name: Frontend unit tests
        run: npm run test

      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test --all-targets

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Lint Rust
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Build installer
        run: npm run tauri build

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe artifacts/
          Copy-Item src-tauri/target/release/free-charles.exe artifacts/FreeCharles-portable.exe
          Get-ChildItem artifacts | Format-Table Name, Length

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: FreeCharles-Windows-x64
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux build and package
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ runner.os }}-linux

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build frontend
        run: npm run build

      - name: Frontend unit tests
        run: npm run test

      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test --all-targets

      - name: Build AppImage
        run: npx tauri build --bundles appimage

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/appimage/*.AppImage artifacts/
          ls -lh artifacts

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: FreeCharles-Linux-x64
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: FreeCharles-Windows-x64
          path: release

      - name: Download Linux package
        uses: actions/download-artifact@v4
        with:
          name: FreeCharles-Linux-x64
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: FreeCharles ${{ github.ref_name }}
          files: |
            release/*.exe
            release/*.AppImage
          generate_release_notes: true
          # 带后缀的 tag（如 v1.1.0-beta.1）自动标记为预发布
          prerelease: ${{ contains(github.ref_name, '-') }}
          draft: false
          fail_on_unmatched_files: true
